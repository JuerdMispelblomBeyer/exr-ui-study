open_questions:
  - id: q.compute_models
    question: What is the Intel model, which stable Jetson ID maps to the communication-box Xavier NX, and what are all hostnames, addresses, OS versions, and installed resources?
  - id: q.lan_topology
    question: Does the current three-node robot use the documented direct 1 GigE Intel-Xavier link, the optional Ethernet switch, or another topology, and what ports, addresses, VLANs, and negotiated speeds apply?
  - id: q.uplink_ha
    question: Which nodes participate in keepalived/VRRP, what virtual IP or route is protected, and how do WiFi and cellular fail over?
  - id: q.can
    question: Is the motherboard STM the current main-CAN controller or bridge, what bitrate, node IDs, protocol, and health signals apply, and is the optional power-injector USB-to-CAN controller installed for a zippermast?
  - id: q.gpio
    question: Does the 2023 motherboard GPIO 0-8 mapping still apply, how does it reconcile with the stated eight-channel bank, and what requested-state, observed-state, interlock, voltage, current, and feedback signals exist per channel?
  - id: q.gas
    question: Which of the maximum four 4-20 mA motherboard ADC channels and reference-listed detector models are installed, and what units, ranges, calibration, validity, thresholds, alarm latching, and power feedback apply?
  - id: q.cameras
    question: Which camera variants are installed now, which Jetson ID hosts the standard panning inspection module, are the drive/front/rear paths still switched USB3 through the power injector, and what stream, FTDI, servo, PTZ, illumination, and power telemetry is observable?
  - id: q.reference_applicability
    question: Which hardware revision and current robot configuration does the 2023 electrical drawing describe, and which minimal, standard, optional, or special components are physically installed on the target robot?
  - id: q.battery_monitoring
    question: What are the BOTP thresholds and fault semantics, cell-voltage and temperature channel definitions, battery-capacity estimator quality, contactor state, and recovery behavior?
  - id: q.power_measurement
    question: What telemetry distinguishes the motherboard input gauge, pack voltage and current, charger power flow, and observed downstream power at each switched domain?
  - id: q.induction_charger
    question: What are the exact induction-charger identifiers, units, update rates, states, docking criteria, faults, stale limits, and CAN message contract?
  - id: q.motor_and_mast_traffic
    question: What exact rates qualify the documented low- and high-frequency motor traffic, and how are drive and optional zippermast commands, feedback, odometry, power, faults, and shared GPIO behavior separated?
  - id: q.chrony
    question: What are the chrony sources, server/client roles, offset limits, and unsynchronized-state criteria?
  - id: q.containers
    question: Which containers run on each node, who owns them, and which dependencies, ports, versions, and restart policies should be shown?
  - id: q.tailscale
    question: Where does Tailscale run, which routes are advertised, and what peer and tunnel health is observable?
  - id: q.fleet_manager
    question: Where do the API and partner agent run, and which connectivity facts belong in this engineering UI without becoming fleet management?
  - id: q.drive_stall
    question: Which controller and source own Drive Stall activation and deactivation, what prerequisites apply, and is manual deactivation local, remote, or either?
  - id: q.poi_capture
    question: What are the POI manager nodes, top-level component, data inputs, microphone path, database technology, placement, and expected capture pipeline?
  - id: q.can_message_contract
    question: Which configuration defines expected CAN messages, rates, subsystem response limits, and health thresholds?
  - id: q.api_agent
    question: Where does the API Agent run, which endpoint and contract does it implement, and which health and authentication signals are authoritative?
  - id: q.cybersecurity
    question: Which sources report unauthorized login attempts, and what privacy, retention, severity, and response policy applies?
  - id: q.ros2_dds
    question: Which ROS 2 distribution, DDS implementation, domains, expected graph, QoS contract, and diagnostic conventions are used?
  - id: q.system_observability
    question: Which metric sources, cadences, stale windows, thresholds, and ownership rules apply to CPU, GPU, network throughput, and storage?
